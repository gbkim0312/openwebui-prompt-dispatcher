<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Dispatcher</title><style>
:root{font-family:system-ui,sans-serif;color:#18212b;background:#f4f7fa}body{margin:0}.top{padding:22px 5vw;background:#13263a;color:white}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:#b9cbdc}.wrap{max-width:1180px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:300px 1fr;gap:22px}.card{background:white;border:1px solid #dce3ea;border-radius:10px;padding:18px;box-shadow:0 2px 8px #13263a0b}h2{font-size:16px;margin:0 0 14px}button{border:0;border-radius:6px;padding:9px 12px;background:#1565c0;color:white;cursor:pointer}button.secondary{background:#e6edf3;color:#233}button.danger{background:#bf3c3c}.job{display:block;width:100%;text-align:left;background:white;color:#18212b;border-bottom:1px solid #edf0f4;border-radius:0}.job.active{background:#e6f0fb}.muted{color:#657485;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #cbd5df;border-radius:6px;padding:9px;font:inherit}textarea{min-height:145px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}#notice{min-height:20px;color:#19713a;font-size:13px;margin-top:8px}.secret{font-family:monospace}.warning{background:#fff5d7;border-left:3px solid #d59000;padding:10px;font-size:13px;margin-bottom:14px}@media(max-width:750px){.wrap{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>Prompt Dispatcher</h1><p>Open WebUI 예약 프롬프트와 메시지 전송 관리</p></header><main class="wrap"><aside class="card"><div class="row" style="justify-content:space-between"><h2>예약 작업</h2><button onclick="newJob()">+ 새 작업</button></div><div id="jobs"></div><hr><h2>연결 설정</h2><p class="muted">민감 값은 눈 버튼으로 표시하거나 숨길 수 있습니다. 저장 후 서비스를 재시작하세요.</p><button class="secondary" onclick="showSettings()">키 / 채널 설정</button></aside><section class="card"><div id="editor"><h2>작업을 선택하세요</h2><p class="muted">왼쪽에서 기존 예약을 선택하거나 새 작업을 만드세요.</p></div></section></main><script>
const $=s=>document.querySelector(s), api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.detail||'요청 실패');return d});
let current=null; const defaults=()=>({version:1,id:'',name:'새 예약',enabled:true,schedule:{cron:'0 9 * * *',timezone:'Asia/Seoul'},openwebui:{model:'qwen3-80b-instruct',skill_ids:[],tool_ids:[],required_tool_ids:[],timeout_seconds:600},prompt:{variables:{}},delivery:{channels:[{type:'telegram',target:'personal'}]},execution:{max_instances:1,skip_if_previous_running:true,misfire_grace_seconds:300,retry_count:0,retry_delay_seconds:30}});
async function list(){let jobs=await api('/api/jobs');$('#jobs').innerHTML=jobs.map(j=>`<button class="job ${j.id===current?'active':''}" onclick="loadJob('${j.id}')"><b>${j.name}</b><br><span class="muted">${j.enabled?'활성':'중지'} · ${j.cron}</span></button>`).join('')||'<p class="muted">등록된 작업 없음</p>'}
function editor(doc,prompt){current=doc.id||null;$('#editor').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${doc.id?'예약 편집':'새 예약'}</h2><span id="notice"></span></div><div class="cols"><div><label>작업 ID</label><input id="id" value="${doc.id}" ${doc.id?'readonly':''}></div><div><label>표시 이름</label><input id="name" value="${doc.name}"></div><div><label>Cron (5 필드)</label><input id="cron" value="${doc.schedule.cron}"></div><div><label>시간대</label><input id="tz" value="${doc.schedule.timezone}"></div><div><label>모델</label><input id="model" value="${doc.openwebui.model}"></div><div><label>Timeout (초)</label><input id="timeout" type="number" value="${doc.openwebui.timeout_seconds}"></div><div><label>Skill IDs (쉼표)</label><input id="skills" value="${doc.openwebui.skill_ids.join(',')}"></div><div><label>Tool IDs (쉼표)</label><input id="tools" value="${doc.openwebui.tool_ids.join(',')}"></div><div class="wide"><label>채널 (한 줄에 type:target, 예: telegram:personal)</label><textarea id="channels">${doc.delivery.channels.map(c=>c.type+':'+c.target).join('\n')}</textarea></div><div class="wide"><label>프롬프트 (Jinja 변수 사용 가능)</label><textarea id="prompt">${prompt||''}</textarea></div><div class="row wide"><label style="display:flex;align-items:center;gap:6px"><input id="enabled" type="checkbox" style="width:auto" ${doc.enabled?'checked':''}> 활성화</label><button onclick="saveJob()">저장</button><button class="secondary" onclick="run(true,false)">Dry Run</button><button class="secondary" onclick="run(true,true)">프롬프트 확인</button>${doc.id?'<button class="danger" onclick="removeJob()">삭제</button>':''}</div></div>`}
async function loadJob(id){let d=await api('/api/jobs/'+id);editor(d.document,d.prompt);await list()};function newJob(){editor(defaults(),'')}; const csv=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);
async function saveJob(){let id=$('#id').value.trim(), channels=$('#channels').value.split('\n').filter(Boolean).map(x=>{let [type,...rest]=x.split(':');return {type:type.trim(),target:rest.join(':').trim()}});let d=defaults();Object.assign(d,{id,name:$('#name').value,enabled:$('#enabled').checked,schedule:{cron:$('#cron').value,timezone:$('#tz').value},openwebui:{model:$('#model').value,skill_ids:csv('#skills'),tool_ids:csv('#tools'),required_tool_ids:[],timeout_seconds:+$('#timeout').value},delivery:{channels}});try{await api('/api/jobs/'+id,{method:'PUT',body:JSON.stringify({document:d,prompt:$('#prompt').value})});$('#notice').textContent='저장 및 스케줄 갱신 완료';current=id;await list()}catch(e){$('#notice').textContent=e.message;$('#notice').style.color='#b21f2d'}}
async function run(dry,skip){if(!current)return;let r=await api(`/api/jobs/${current}/run?dry_run=${dry}&skip_openwebui=${skip}`,{method:'POST'});$('#notice').textContent=`${r.status}${r.message?' · '+r.message:''}`}; async function removeJob(){if(current&&confirm('이 작업과 프롬프트를 삭제할까요?')){await api('/api/jobs/'+current,{method:'DELETE'});current=null;$('#editor').innerHTML='<h2>삭제됨</h2>';list()}}
const sensitiveSettings=new Set(['OPENWEBUI_API_KEY','TELEGRAM_PERSONAL_BOT_TOKEN','NEXTCLOUD_TALK_PERSONAL_APP_PASSWORD','NEXTCLOUD_TALK_PERSONAL_ROOM_TOKEN']);
async function showSettings(){let d=await api('/api/settings'),fields=[['OPENWEBUI_BASE_URL','Open WebUI URL'],['OPENWEBUI_API_KEY','Open WebUI API Key'],['TELEGRAM_PERSONAL_BOT_TOKEN','Telegram Bot Token'],['TELEGRAM_PERSONAL_CHAT_ID','Telegram Chat ID'],['NEXTCLOUD_URL','Nextcloud URL'],['NEXTCLOUD_TALK_PERSONAL_USERNAME','Talk username'],['NEXTCLOUD_TALK_PERSONAL_APP_PASSWORD','Talk app password'],['NEXTCLOUD_TALK_PERSONAL_ROOM_TOKEN','Talk room token']];$('#editor').innerHTML=`<h2>연결 설정</h2><div class="warning">민감 값은 눈 버튼을 눌러 확인할 수 있습니다. 이 UI는 인증 없이 민감 값을 브라우저에 표시하므로 신뢰된 로컬·내부망에서만 사용하세요. 저장 후 서비스를 재시작해야 실제 연결에 반영됩니다.</div><div class="cols">${fields.map(([k,l])=>`<div><label>${l} ${d.configured.includes(k)?'<span class="muted">(설정됨)</span>':''}</label><div class="row"><input class="setting-field" id="${k}" type="${sensitiveSettings.has(k)?'password':'text'}" autocomplete="off">${sensitiveSettings.has(k)?`<button class="secondary" type="button" onclick="toggleSetting('${k}',this)" aria-label="값 표시 또는 숨김">👁</button>`:''}</div></div>`).join('')}</div><p id="notice"></p><button onclick="saveSettings()">설정 저장</button>`;fields.forEach(([key])=>{$('#'+key).value=d.values[key]||''})};function toggleSetting(id,button){const input=$('#'+id),shown=input.type==='text';input.type=shown?'password':'text';button.textContent=shown?'👁':'🙈'};async function saveSettings(){let values={};document.querySelectorAll('.setting-field').forEach(x=>values[x.id]=x.value);let r=await api('/api/settings',{method:'PUT',body:JSON.stringify({values})});$('#notice').textContent=r.message};list();
</script><script>
const baseEditor=editor;let modelRevision='';
async function loadModels(selected){const holder=$('#model');holder.outerHTML='<div id="model-picker"><button id="model-toggle" class="secondary" type="button"></button><div id="model-panel" hidden><input id="model-search" placeholder="모델명 검색…" autocomplete="off"><select id="model" size="8" aria-label="Open WebUI 모델"></select><div class="row"><p id="model-count" class="muted"></p><button class="secondary" type="button" onclick="refreshModels()">모델 새로고침</button></div></div></div>';const select=$('#model'),search=$('#model-search'),count=$('#model-count'),toggle=$('#model-toggle'),panel=$('#model-panel');let chosen=selected;toggle.textContent=chosen+'  ▾';toggle.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)search.focus()};try{const data=await api('/api/models'),models=data.models||[];modelRevision=data.revision||modelRevision;const render=()=>{const query=search.value.trim().toLowerCase(),filtered=models.filter(model=>model.toLowerCase().includes(query));select.replaceChildren();for(const model of filtered){const option=document.createElement('option');option.value=model;option.textContent=model;select.append(option)}if(!filtered.length){const option=document.createElement('option');option.disabled=true;option.textContent='일치하는 모델이 없습니다';select.append(option)}if(filtered.includes(chosen))select.value=chosen;count.textContent=`${filtered.length} / ${models.length}개 모델`};select.onchange=()=>{chosen=select.value;toggle.textContent=chosen+'  ▾';panel.hidden=true};search.addEventListener('input',render);render()}catch(error){const input=document.createElement('input');input.id='model';input.value=selected;input.title=error.message;input.placeholder='모델명을 직접 입력하세요';$('#model-picker')?.replaceWith(input)}}
async function refreshModels(){const selected=$('#model').value;const data=await api('/api/models/refresh',{method:'POST'});modelRevision=data.revision||modelRevision;loadModels(selected)}
setInterval(async()=>{if(!$('#model-picker'))return;try{const data=await api('/api/models');if(data.revision&&data.revision!==modelRevision)loadModels($('#model').value)}catch(error){}},10000);
editor=function(document,prompt){baseEditor(document,prompt);loadModels(document.openwebui.model)};
</script></body></html>
