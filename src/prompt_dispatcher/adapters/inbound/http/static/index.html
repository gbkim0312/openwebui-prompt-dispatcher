<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Dispatcher</title><style>
:root{font-family:system-ui,sans-serif;color:#18212b;background:#f4f7fa}body{margin:0}.top{padding:22px 5vw;background:#13263a;color:white}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:#b9cbdc}.wrap{max-width:1180px;margin:26px auto;padding:0 20px;display:grid;grid-template-columns:300px 1fr;gap:22px}.card{background:white;border:1px solid #dce3ea;border-radius:10px;padding:18px;box-shadow:0 2px 8px #13263a0b}h2{font-size:16px;margin:0 0 14px}h3{font-size:15px;margin:0 0 4px}button{border:0;border-radius:6px;padding:9px 12px;background:#1565c0;color:white;cursor:pointer}button.secondary{background:#e6edf3;color:#233}button.danger{background:#bf3c3c}.job{display:block;width:100%;text-align:left;background:white;color:#18212b;border-bottom:1px solid #edf0f4;border-radius:0}.job.active{background:#e6f0fb}.muted{color:#657485;font-size:13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.input-with-toggle{display:flex;gap:8px;align-items:stretch}.input-with-toggle input{width:auto;flex:1;min-width:0}.input-with-toggle button{flex:0 0 auto}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #cbd5df;border-radius:6px;padding:9px;font:inherit}textarea{min-height:145px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-groups{display:grid;gap:14px}.settings-group{border:1px solid #dce3ea;border-radius:9px;padding:15px;background:#f9fbfd}.log-view{margin:0;min-height:420px;max-height:65vh;overflow:auto;white-space:pre-wrap;background:#101923;color:#d7e3ee;border-radius:8px;padding:14px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.wide{grid-column:1/-1}#notice{min-height:20px;color:#19713a;font-size:13px;margin-top:8px}.secret{font-family:monospace}.warning{background:#fff5d7;border-left:3px solid #d59000;padding:10px;font-size:13px;margin-bottom:14px}@media(max-width:750px){.wrap{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>Prompt Dispatcher</h1><p>Open WebUI 예약 프롬프트와 메시지 전송 관리</p></header><main class="wrap"><aside class="card"><div class="row" style="justify-content:space-between"><h2>예약 작업</h2><button onclick="newJob()">+ 새 작업</button></div><div id="jobs"></div><hr><h2>도구</h2><div class="row"><button class="secondary" onclick="showInstantPrompt()">즉시 전송</button><button class="secondary" onclick="showLogs()">실행 로그</button></div><hr><h2>연결 설정</h2><p class="muted">민감 값은 눈 버튼으로 표시하거나 숨길 수 있습니다. 저장 후 서비스를 재시작하세요.</p><button class="secondary" onclick="showSettings()">키 / 채널 설정</button></aside><section class="card"><div id="editor"><h2>작업을 선택하세요</h2><p class="muted">왼쪽에서 기존 예약을 선택하거나 새 작업을 만드세요.</p></div></section></main><script>
const $=s=>document.querySelector(s), api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.detail||'요청 실패');return d});
let current=null,logTimer=null; const defaults=()=>({version:1,id:'',name:'새 예약',enabled:true,schedule:{cron:'0 9 * * *',timezone:'Asia/Seoul'},openwebui:{model:'gpt-5.6-luna',skill_ids:[],tool_ids:[],required_tool_ids:[],timeout_seconds:600,web_search_time_range:null},prompt:{variables:{}},delivery:{channels:[{type:'telegram',target:'personal'}]},execution:{max_instances:1,skip_if_previous_running:true,misfire_grace_seconds:300,retry_count:0,retry_delay_seconds:30}});
async function list(){let jobs=await api('/api/jobs');$('#jobs').innerHTML=jobs.map(j=>`<button class="job ${j.id===current?'active':''}" onclick="loadJob('${j.id}')"><b>${j.name}</b><br><span class="muted">${j.enabled?'활성':'중지'} · ${j.cron}</span></button>`).join('')||'<p class="muted">등록된 작업 없음</p>'}
function editor(doc,prompt){if(logTimer)clearInterval(logTimer);current=doc.id||null;$('#editor').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${doc.id?'예약 편집':'새 예약'}</h2><span id="notice"></span></div><div class="cols"><div><label>작업 ID</label><input id="id" value="${doc.id}" ${doc.id?'readonly':''}></div><div><label>표시 이름</label><input id="name" value="${doc.name}"></div><div><label>Cron (5 필드)</label><input id="cron" value="${doc.schedule.cron}"></div><div><label>시간대</label><input id="tz" value="${doc.schedule.timezone}"></div><div><label>모델</label><input id="model" value="${doc.openwebui.model}"></div><div><label>Timeout (초)</label><input id="timeout" type="number" value="${doc.openwebui.timeout_seconds}"></div><div><label>Skill IDs (쉼표)</label><input id="skills" value="${doc.openwebui.skill_ids.join(',')}"></div><div><label>Tool IDs (쉼표)</label><input id="tools" value="${doc.openwebui.tool_ids.join(',')}"></div><div class="wide"><label>채널 (한 줄에 type:target, 예: telegram:personal)</label><textarea id="channels">${doc.delivery.channels.map(c=>c.type+':'+c.target).join('\n')}</textarea></div><div class="wide"><label>프롬프트 (Jinja 변수 사용 가능)</label><textarea id="prompt">${prompt||''}</textarea></div><div class="row wide"><label style="display:flex;align-items:center;gap:6px"><input id="enabled" type="checkbox" style="width:auto" ${doc.enabled?'checked':''}> 활성화</label><button onclick="saveJob()">저장</button><button class="secondary" onclick="run(true,false)">Dry Run</button><button class="secondary" onclick="run(true,true)">프롬프트 확인</button><button class="secondary" onclick="testJobPrompt()">테스트 전송</button>${doc.id?'<button class="danger" onclick="removeJob()">삭제</button>':''}</div></div><h3>테스트 결과</h3><pre id="job-test-result" class="log-view">대기 중</pre>`}
async function loadJob(id){let d=await api('/api/jobs/'+id);editor(d.document,d.prompt);await list()};function newJob(){editor(defaults(),'')}; const csv=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);
async function saveJob(){let id=$('#id').value.trim(), channels=$('#channels').value.split('\n').filter(Boolean).map(x=>{let [type,...rest]=x.split(':');return {type:type.trim(),target:rest.join(':').trim()}});let d=defaults();Object.assign(d,{id,name:$('#name').value,enabled:$('#enabled').checked,schedule:{cron:$('#cron').value,timezone:$('#tz').value},openwebui:{model:$('#model').value,skill_ids:csv('#skills'),tool_ids:csv('#tools'),required_tool_ids:[],timeout_seconds:+$('#timeout').value},delivery:{channels}});try{await api('/api/jobs/'+id,{method:'PUT',body:JSON.stringify({document:d,prompt:$('#prompt').value})});$('#notice').textContent='저장 및 스케줄 갱신 완료';current=id;await list()}catch(e){$('#notice').textContent=e.message;$('#notice').style.color='#b21f2d'}}
async function run(dry,skip){if(!current)return;let r=await api(`/api/jobs/${current}/run?dry_run=${dry}&skip_openwebui=${skip}`,{method:'POST'});$('#notice').textContent=`${r.status}${r.message?' · '+r.message:''}`}; async function removeJob(){if(current&&confirm('이 작업과 프롬프트를 삭제할까요?')){await api('/api/jobs/'+current,{method:'DELETE'});current=null;$('#editor').innerHTML='<h2>삭제됨</h2>';list()}}
const sensitiveSettings=new Set(['OPENWEBUI_API_KEY','TELEGRAM_PERSONAL_BOT_TOKEN','NEXTCLOUD_TALK_PERSONAL_APP_PASSWORD','NEXTCLOUD_TALK_PERSONAL_ROOM_TOKEN']);
async function showSettings(){if(logTimer)clearInterval(logTimer);let d=await api('/api/settings'),groups=[['Open WebUI',[['OPENWEBUI_BASE_URL','Open WebUI URL'],['OPENWEBUI_API_KEY','Open WebUI API Key']]],['Telegram',[['TELEGRAM_PERSONAL_BOT_TOKEN','Telegram Bot Token'],['TELEGRAM_PERSONAL_CHAT_ID','Telegram Chat ID']]],['Nextcloud Talk',[['NEXTCLOUD_URL','Nextcloud URL'],['NEXTCLOUD_TALK_PERSONAL_USERNAME','Talk username'],['NEXTCLOUD_TALK_PERSONAL_APP_PASSWORD','Talk app password'],['NEXTCLOUD_TALK_PERSONAL_ROOM_TOKEN','Talk room token']]]],fields=groups.flatMap(([,items])=>items),field=([k,l])=>`<div><label>${l} ${d.configured.includes(k)?'<span class="muted">(설정됨)</span>':''}</label><div class="${sensitiveSettings.has(k)?'input-with-toggle':''}"><input class="setting-field" id="${k}" type="${sensitiveSettings.has(k)?'password':'text'}" autocomplete="off">${sensitiveSettings.has(k)?`<button class="secondary" type="button" onclick="toggleSetting('${k}',this)" aria-label="값 표시 또는 숨김">👁</button>`:''}</div></div>`;$('#editor').innerHTML=`<h2>연결 설정</h2><div class="warning">민감 값은 눈 버튼을 눌러 확인할 수 있습니다. 이 UI는 인증 없이 민감 값을 브라우저에 표시하므로 신뢰된 로컬·내부망에서만 사용하세요. 저장 후 서비스를 재시작해야 실제 연결에 반영됩니다.</div><div class="settings-groups">${groups.map(([title,items])=>`<section class="settings-group"><h3>${title}</h3><div class="cols">${items.map(field).join('')}</div></section>`).join('')}</div><p id="notice"></p><button onclick="saveSettings()">설정 저장</button>`;fields.forEach(([key])=>{$('#'+key).value=d.values[key]||''})};function toggleSetting(id,button){const input=$('#'+id),shown=input.type==='text';input.type=shown?'password':'text';button.textContent=shown?'👁':'🙈'};async function saveSettings(){let values={};document.querySelectorAll('.setting-field').forEach(x=>values[x.id]=x.value);let r=await api('/api/settings',{method:'PUT',body:JSON.stringify({values})});$('#notice').textContent=r.message};async function loadLogs(){const data=await api('/api/logs?limit=300');const view=$('#log-view');if(view){view.textContent=data.lines.join('\n')||'아직 기록된 실행 로그가 없습니다.';view.scrollTop=view.scrollHeight}}async function showLogs(){if(logTimer)clearInterval(logTimer);$('#editor').innerHTML='<div class="row" style="justify-content:space-between"><h2>실행 로그</h2><button class="secondary" onclick="loadLogs()">새로고침</button></div><p class="muted">10초마다 자동 갱신됩니다. 키, 토큰, 프롬프트와 응답 전문은 기록하지 않습니다.</p><pre id="log-view" class="log-view">불러오는 중…</pre>';await loadLogs();logTimer=setInterval(loadLogs,10000)}async function showInstantPrompt(){if(logTimer)clearInterval(logTimer);$('#editor').innerHTML='<h2>즉시 전송</h2><div class="warning">전송을 누르면 Open WebUI 응답을 생성한 뒤 지정 채널로 즉시 보냅니다. 먼저 Dry Run으로 결과를 확인할 수 있습니다.</div><div class="cols"><div><label>제목</label><input id="instant-title" value="즉시 프롬프트"></div><div><label>모델</label><input id="instant-model" list="instant-models" placeholder="모델 선택 또는 입력"><datalist id="instant-models"></datalist></div><div class="wide"><label>채널 (한 줄에 type:target)</label><textarea id="instant-channels" placeholder="telegram:personal\nnextcloud_talk:personal"></textarea></div><div class="wide"><label>프롬프트</label><textarea id="instant-prompt" placeholder="지금 실행할 프롬프트를 입력하세요."></textarea></div><div class="row wide"><label style="display:flex;align-items:center;gap:6px"><input id="instant-dry-run" type="checkbox" style="width:auto"> Dry Run — 채널에 보내지 않음</label><button onclick="sendInstantPrompt()">Open WebUI 실행 및 전송</button></div></div><h3>결과</h3><pre id="instant-result" class="log-view">대기 중</pre>';try{const data=await api('/api/models');const models=data.models||[],list=$('#instant-models');for(const model of models){const option=document.createElement('option');option.value=model;list.append(option)}$('#instant-model').value=models.includes('qwen3-80b-instruct')?'qwen3-80b-instruct':models[0]||''}catch(error){$('#instant-result').textContent='모델 목록을 불러오지 못했습니다. 모델명을 직접 입력하세요.'}}async function sendInstantPrompt(){const result=$('#instant-result'),channels=$('#instant-channels').value.split('\n').filter(Boolean).map(line=>{const [type,...rest]=line.split(':');return {type:type.trim(),target:rest.join(':').trim()}});result.textContent='Open WebUI 응답 생성 중…';try{const data=await api('/api/prompt/send',{method:'POST',body:JSON.stringify({title:$('#instant-title').value,model:$('#instant-model').value,prompt:$('#instant-prompt').value,channels,dry_run:$('#instant-dry-run').checked})});const sent=data.successful_targets.length?`전송 성공: ${data.successful_targets.join(', ')}`:'전송 없음';const failed=data.failed_targets.length?`\n전송 실패: ${data.failed_targets.join(', ')}`:'';result.textContent=`${sent}${failed}\n\n${data.content}`}catch(error){result.textContent='실행 실패: '+error.message}};list();
</script><script>
const baseEditor=editor;let modelRevision='';
async function loadModels(selected){const holder=$('#model');holder.outerHTML='<div id="model-picker"><button id="model-toggle" class="secondary" type="button"></button><div id="model-panel" hidden><input id="model-search" placeholder="모델명 검색…" autocomplete="off"><select id="model" size="8" aria-label="Open WebUI 모델"></select><div class="row"><p id="model-count" class="muted"></p><button class="secondary" type="button" onclick="refreshModels()">모델 새로고침</button></div></div></div>';const select=$('#model'),search=$('#model-search'),count=$('#model-count'),toggle=$('#model-toggle'),panel=$('#model-panel');let chosen=selected;toggle.textContent=chosen+'  ▾';toggle.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)search.focus()};try{const data=await api('/api/models'),models=data.models||[];modelRevision=data.revision||modelRevision;const render=()=>{const query=search.value.trim().toLowerCase(),filtered=models.filter(model=>model.toLowerCase().includes(query));select.replaceChildren();for(const model of filtered){const option=document.createElement('option');option.value=model;option.textContent=model;select.append(option)}if(!filtered.length){const option=document.createElement('option');option.disabled=true;option.textContent='일치하는 모델이 없습니다';select.append(option)}if(filtered.includes(chosen))select.value=chosen;count.textContent=`${filtered.length} / ${models.length}개 모델`};select.onchange=()=>{chosen=select.value;toggle.textContent=chosen+'  ▾';panel.hidden=true};search.addEventListener('input',render);render()}catch(error){const input=document.createElement('input');input.id='model';input.value=selected;input.title=error.message;input.placeholder='모델명을 직접 입력하세요';$('#model-picker')?.replaceWith(input)}}
async function refreshModels(){const selected=$('#model').value;const data=await api('/api/models/refresh',{method:'POST'});modelRevision=data.revision||modelRevision;loadModels(selected)}
setInterval(async()=>{if(!$('#model-picker'))return;try{const data=await api('/api/models');if(data.revision&&data.revision!==modelRevision)loadModels($('#model').value)}catch(error){}},10000);
editor=function(document,prompt){baseEditor(document,prompt);loadModels(document.openwebui.model)};
</script><script>
window.showInstantPrompt=async function(){if(logTimer)clearInterval(logTimer);$('#editor').innerHTML='<h2>즉시 전송</h2><div class="warning">전송을 누르면 Open WebUI 응답을 생성한 뒤 선택한 채널로 즉시 보냅니다. 먼저 Dry Run으로 결과를 확인할 수 있습니다.</div><div class="cols"><div><label>제목</label><input id="instant-title" value="즉시 프롬프트"></div><div><label>모델</label><div id="instant-model-picker"></div></div><div class="wide"><label>전송 채널</label><div id="instant-channels" class="row muted">채널 목록 불러오는 중…</div></div><div class="wide"><label>프롬프트</label><textarea id="instant-prompt" placeholder="지금 실행할 프롬프트를 입력하세요."></textarea></div><div class="row wide"><label style="display:flex;align-items:center;gap:6px"><input id="instant-dry-run" type="checkbox" style="width:auto"> Dry Run — 채널에 보내지 않음</label><button onclick="sendInstantPrompt()">Open WebUI 실행 및 전송</button></div></div><h3>결과</h3><pre id="instant-result" class="log-view">대기 중</pre>';loadInstantModels();loadInstantChannels()};
let instantModelRevision='';
async function loadInstantModels(selected='gpt-5.6-luna'){const picker=$('#instant-model-picker');picker.innerHTML='<button id="instant-model-toggle" class="secondary" type="button">모델 불러오는 중…</button><div id="instant-model-panel" hidden><input id="instant-model-search" placeholder="모델명 검색…" autocomplete="off"><select id="instant-model" size="8" aria-label="즉시 전송 모델"></select><div class="row"><p id="instant-model-count" class="muted"></p><button class="secondary" type="button" onclick="refreshInstantModels()">모델 새로고침</button></div></div>';const toggle=$('#instant-model-toggle'),panel=$('#instant-model-panel'),search=$('#instant-model-search'),select=$('#instant-model'),count=$('#instant-model-count');let chosen=selected;toggle.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)search.focus()};try{const data=await api('/api/models'),models=data.models||[];instantModelRevision=data.revision||instantModelRevision;if(!models.includes(chosen))chosen=models[0]||'';const render=()=>{const filtered=models.filter(model=>model.toLowerCase().includes(search.value.trim().toLowerCase()));select.replaceChildren();for(const model of filtered){const option=document.createElement('option');option.value=model;option.textContent=model;select.append(option)}if(!filtered.length){const option=document.createElement('option');option.disabled=true;option.textContent='일치하는 모델이 없습니다';select.append(option)}if(filtered.includes(chosen))select.value=chosen;count.textContent=`${filtered.length} / ${models.length}개 모델`};toggle.textContent=chosen+'  ▾';select.onchange=()=>{chosen=select.value;toggle.textContent=chosen+'  ▾';panel.hidden=true};search.oninput=render;render()}catch(error){picker.innerHTML='<input id="instant-model" value="gpt-5.6-luna" placeholder="모델명을 직접 입력하세요">'}}
async function refreshInstantModels(){const selected=$('#instant-model').value;const data=await api('/api/models/refresh',{method:'POST'});instantModelRevision=data.revision||instantModelRevision;loadInstantModels(selected)}
setInterval(async()=>{if(!$('#instant-model-picker')||!$('#instant-model'))return;try{const data=await api('/api/models');if(data.revision&&data.revision!==instantModelRevision)loadInstantModels($('#instant-model').value)}catch(error){}},10000);
async function loadInstantChannels(){const container=$('#instant-channels');try{const channels=await api('/api/channels');container.replaceChildren();if(!channels.length){container.textContent='등록된 채널 목적지가 없습니다. Job에 채널을 먼저 추가하세요.';return}for(const channel of channels){const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');input.type='checkbox';input.className='instant-channel';input.dataset.type=channel.type;input.dataset.target=channel.target;input.style.width='auto';text.textContent=` ${channel.type}: ${channel.target}`;label.style.margin='0';label.style.display='flex';label.style.alignItems='center';label.append(input,text);container.append(label)}}catch(error){container.textContent='채널 목록을 불러오지 못했습니다.'}}
window.sendInstantPrompt=async function(){const result=$('#instant-result'),channels=[...document.querySelectorAll('.instant-channel:checked')].map(input=>({type:input.dataset.type,target:input.dataset.target}));result.textContent='Open WebUI 응답 생성 중…';try{const data=await api('/api/prompt/send',{method:'POST',body:JSON.stringify({title:$('#instant-title').value,model:$('#instant-model').value,prompt:$('#instant-prompt').value,channels,dry_run:$('#instant-dry-run').checked})});const sent=data.successful_targets.length?`전송 성공: ${data.successful_targets.join(', ')}`:'전송 없음';const failed=data.failed_targets.length?`\n전송 실패: ${data.failed_targets.join(', ')}`:'';result.textContent=`${sent}${failed}\n\n${data.content}`}catch(error){result.textContent='실행 실패: '+error.message}};
</script><script>
const jobEditorWithModel=editor;
async function loadJobChannels(selected){const textarea=$('#channels');if(!textarea)return;textarea.style.display='none';const label=textarea.previousElementSibling;if(label)label.textContent='전송 채널';let picker=$('#job-channels');if(!picker){picker=document.createElement('div');picker.id='job-channels';picker.className='row';textarea.before(picker)}const selectedKeys=new Set(selected.map(channel=>`${channel.type}:${channel.target}`));try{const channels=await api('/api/channels');picker.replaceChildren();for(const channel of channels){const key=`${channel.type}:${channel.target}`,label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');input.type='checkbox';input.className='job-channel';input.dataset.type=channel.type;input.dataset.target=channel.target;input.checked=selectedKeys.has(key);input.style.width='auto';text.textContent=` ${channel.type}: ${channel.target}`;label.style.margin='0';label.style.display='flex';label.style.alignItems='center';label.append(input,text);picker.append(label)}const sync=()=>{textarea.value=[...picker.querySelectorAll('.job-channel:checked')].map(input=>`${input.dataset.type}:${input.dataset.target}`).join('\n')};picker.addEventListener('change',sync);sync()}catch(error){textarea.style.display='block';if(label)label.textContent='채널 (한 줄에 type:target, 예: telegram:personal)'}}

saveJob=async function(){const tasks=collectResearchTasks();for(const task of tasks){if(!task.id||!task.name||!task.query){$('#notice').textContent='모든 리서치 작업에 식별자, 표시 이름, 검색어를 입력하세요.';$('#notice').style.color='#b21f2d';return}}let id=$('#id').value.trim(),channels=$('#channels').value.split('\n').filter(Boolean).map(x=>{let [type,...rest]=x.split(':');return {type:type.trim(),target:rest.join(':').trim()}}),d=defaults(),search=searchConfig('job');Object.assign(d,{id,name:$('#name').value,enabled:$('#enabled').checked,schedule:{cron:$('#cron').value,timezone:$('#tz').value},openwebui:{model:$('#model').value,skill_ids:[],tool_ids:[],required_tool_ids:[],timeout_seconds:+$('#timeout').value,...search},delivery:{channels},research:{tasks}});try{await api('/api/jobs/'+id,{method:'PUT',body:JSON.stringify({document:d,prompt:$('#prompt').value})});$('#notice').textContent='저장 및 스케줄 갱신 완료';current=id;await list()}catch(e){$('#notice').textContent=e.message;$('#notice').style.color='#b21f2d'}};
</script><script>
let researchUseParentModelUi=true,researchModelNames=[];
const renderResearchTasksWithModels=()=>{const container=$('#research-task-list');if(!container)return;container.replaceChildren();if(!researchTasksUi.length){container.innerHTML='<p class="muted">등록된 리서치 작업이 없습니다. 필요한 분야를 추가하세요.</p>';return}const parentModel=$('#model')?.value||'';researchTasksUi.forEach((task,index)=>{const row=document.createElement('section');row.className='settings-group';const selectedModel=researchUseParentModelUi?parentModel:task.model;const options=[selectedModel,task.model,...researchModelNames].filter((value,index,all)=>value&&all.indexOf(value)===index).map(model=>`<option value="${taskValue(model)}">${taskValue(model)}</option>`).join('');row.innerHTML=`<div class="row" style="justify-content:space-between"><h3>리서치 ${index+1}</h3><button class="danger" type="button" onclick="removeResearchTask(${index})">삭제</button></div><div class="cols"><div><label>식별자</label><input class="research-id" value="${taskValue(task.id)}" placeholder="politics"></div><div><label>표시 이름</label><input class="research-name" value="${taskValue(task.name)}" placeholder="정치"></div><div class="wide"><label>검색어</label><input class="research-query" value="${taskValue(task.query)}" placeholder="오늘 주요 정치 뉴스"></div><div><label>검색 기간</label><select class="research-time">${searchPeriods.map(([id,label])=>`<option value="${id}" ${task.time_range===id?'selected':''}>${label}</option>`).join('')}</select></div><div><label>주제</label><select class="research-topic">${[['news','뉴스'],['general','일반'],['finance','금융']].map(([id,label])=>`<option value="${id}" ${task.topic===id?'selected':''}>${label}</option>`).join('')}</select></div><div><label>결과 수</label><input class="research-max" type="number" min="1" max="20" value="${task.max_results||5}"></div><div><label>검색 깊이</label><select class="research-depth">${[['basic','기본'],['fast','빠름'],['ultra-fast','매우 빠름'],['advanced','상세 (2 크레딧)']].map(([id,label])=>`<option value="${id}" ${task.search_depth===id?'selected':''}>${label}</option>`).join('')}</select></div><div class="research-model-wrap"><label>리서치 모델</label><select class="research-model" ${researchUseParentModelUi?'disabled':''}><option value="">모델 선택</option>${options}</select></div><div class="wide"><label>요약 지시 <span class="muted">(선택)</span></label><textarea class="research-summary" placeholder="검색 결과에서 핵심 사실, 영향, 출처를 5개 이내로 요약하세요.">${taskValue(task.summary_prompt)}</textarea></div><div><label>포함 도메인 <span class="muted">(쉼표)</span></label><input class="research-include" value="${taskValue((task.include_domains||[]).join(','))}"></div><div><label>제외 도메인 <span class="muted">(쉼표)</span></label><input class="research-exclude" value="${taskValue((task.exclude_domains||[]).join(','))}"></div></div>`;const select=row.querySelector('.research-model');if(selectedModel)select.value=selectedModel;container.append(row)})};
renderResearchTasks=renderResearchTasksWithModels;
collectResearchTasks=function(){const domains=input=>input.value.split(',').map(value=>value.trim()).filter(Boolean);return [...document.querySelectorAll('#research-task-list .settings-group')].map(row=>({id:row.querySelector('.research-id').value.trim(),name:row.querySelector('.research-name').value.trim(),query:row.querySelector('.research-query').value.trim(),summary_prompt:row.querySelector('.research-summary').value.trim(),time_range:row.querySelector('.research-time').value,topic:row.querySelector('.research-topic').value,search_depth:row.querySelector('.research-depth').value,max_results:+row.querySelector('.research-max').value||5,include_domains:domains(row.querySelector('.research-include')),exclude_domains:domains(row.querySelector('.research-exclude')),model:row.querySelector('.research-model').value||null}))};
async function loadResearchModels(){try{const data=await api('/api/models');researchTasksUi=collectResearchTasks();researchModelNames=data.models||[];renderResearchTasksWithModels()}catch(error){}};
const editorWithResearchModels=editor;
function syncResearchToParentModel(){if(!$('#research-use-parent-model')?.checked)return;researchTasksUi=collectResearchTasks();const parentModel=$('#model')?.value||'';researchTasksUi.forEach(task=>{task.model=parentModel||null});renderResearchTasksWithModels()}
editor=function(document,prompt){editorWithResearchModels(document,prompt);queueMicrotask(()=>queueMicrotask(()=>queueMicrotask(()=>{const form=$('#research-form');if(!form)return;researchUseParentModelUi=document.research?.use_parent_model??true;form.insertAdjacentHTML('afterbegin',`<label style="display:flex;align-items:center;gap:6px"><input id="research-use-parent-model" type="checkbox" style="width:auto" ${researchUseParentModelUi?'checked':''}> 모든 리서치에 상위 작업 모델 사용</label><p class="muted">해제하면 각 리서치 행에서 모델을 선택할 수 있습니다.</p>`);$('#research-use-parent-model').onchange=event=>{researchTasksUi=collectResearchTasks();researchUseParentModelUi=event.target.checked;if(researchUseParentModelUi){const parentModel=$('#model')?.value||'';researchTasksUi.forEach(task=>{task.model=parentModel||null})}renderResearchTasksWithModels()};const parent=$('#model');if(parent&&!parent.dataset.researchModelBound){parent.dataset.researchModelBound='true';parent.addEventListener('change',syncResearchToParentModel)}loadResearchModels()})))};
saveJob=async function(){const tasks=collectResearchTasks(),useParentModel=$('#research-use-parent-model').checked;for(const task of tasks){if(!task.id||!task.name||!task.query){$('#notice').textContent='모든 리서치 작업에 식별자, 표시 이름, 검색어를 입력하세요.';$('#notice').style.color='#b21f2d';return false}if(!useParentModel&&!task.model){$('#notice').textContent='개별 모델 사용 시 모든 리서치 작업의 모델을 선택하세요.';$('#notice').style.color='#b21f2d';return false}}let id=$('#id').value.trim(),channels=$('#channels').value.split('\n').filter(Boolean).map(x=>{let [type,...rest]=x.split(':');return {type:type.trim(),target:rest.join(':').trim()}}),d=defaults(),search=searchConfig('job');Object.assign(d,{id,name:$('#name').value,enabled:$('#enabled').checked,schedule:{cron:$('#cron').value,timezone:$('#tz').value},openwebui:{model:$('#model').value,skill_ids:[],tool_ids:[],required_tool_ids:[],timeout_seconds:+$('#timeout').value,...search},delivery:{channels},research:{use_parent_model:useParentModel,tasks}});try{await api('/api/jobs/'+id,{method:'PUT',body:JSON.stringify({document:d,prompt:$('#prompt').value})});$('#notice').textContent='저장 및 스케줄 갱신 완료';current=id;await list();return true}catch(e){$('#notice').textContent=e.message;$('#notice').style.color='#b21f2d';return false}};
</script><style>
#research-form{display:grid;gap:16px;margin:24px 0 20px;padding:22px;border:1px solid #dce3ea;border-radius:12px;background:#f9fbfd}

#research-task-list .settings-group>.row{margin-bottom:8px}
</style><script>
function decorateResearchCards(){for(const card of document.querySelectorAll('#research-task-list .settings-group:not([data-collapse-ready])')){card.dataset.collapseReady='true';card.classList.add('research-collapsed');const header=card.querySelector(':scope > .row'),toggle=document.createElement('button');toggle.type='button';toggle.className='secondary research-toggle';toggle.textContent='펼치기';toggle.onclick=()=>{const collapsed=card.classList.toggle('research-collapsed');toggle.textContent=collapsed?'펼치기':'접기'};header?.insertBefore(toggle,header.querySelector('.danger'))}}

decorateResearchCards();
</script><script>
let expandNextResearchCard=false;
window.addResearchTask=function(){const cards=[...document.querySelectorAll('#research-task-list .settings-group')];researchTasksUi=collectResearchTasks();researchTasksUi.forEach((task,index)=>{task._expanded=!cards[index]?.classList.contains('research-collapsed')});researchTasksUi.push({...researchTaskDefault(),_expanded:true});renderResearchTasks();setTimeout(()=>{for(const [index,card] of [...document.querySelectorAll('#research-task-list .settings-group')].entries()){const expanded=researchTasksUi[index]?._expanded===true;card.classList.toggle('research-collapsed',!expanded);const toggle=card.querySelector('.research-toggle');if(toggle)toggle.textContent=expanded?'접기':'펼치기'}},0)};
function labelResearchCards(){for(const card of document.querySelectorAll('#research-task-list .settings-group')){const title=card.querySelector(':scope > .row h3'),input=card.querySelector('.research-name');if(!title||!input)continue;const index=[...document.querySelectorAll('#research-task-list .settings-group')].indexOf(card)+1,displayName=input.value.trim()||`리서치 ${index}`;if(title.textContent!==displayName)title.textContent=displayName;if(card.dataset.titleReady)continue;card.dataset.titleReady='true';input.addEventListener('input',()=>{const updatedName=input.value.trim()||`리서치 ${index}`;if(title.textContent!==updatedName)title.textContent=updatedName})}}
new MutationObserver(labelResearchCards).observe(document.body,{childList:true,subtree:true});

</script><style>
#research-task-list .research-collapsed>.cols{display:none}
#research-task-list .research-toggle{margin-left:auto}
</style><script>
function prepareSearchPanel(prefix){const control=$('#'+prefix+'-search-control');if(!control)return null;const label=control.querySelector(':scope > label');let panel=control.querySelector(':scope > .search-options');if(!panel){panel=document.createElement('div');panel.className='search-options';for(const child of [...control.children])if(child!==label)panel.append(child);control.append(panel)}return {control,label,panel}}
bindSearchControl=function(prefix){const prepared=prepareSearchPanel(prefix);if(!prepared)return;const {control,panel}=prepared,enabled=$('#'+prefix+'-search-enabled');const update=()=>{const active=enabled.checked;panel.hidden=!active;for(const input of panel.querySelectorAll('input,select,textarea,button'))input.disabled=!active;control.classList.toggle('search-disabled',!active)};enabled.onchange=update;update();control.dataset.searchPanelReady='true'};
function hydrateSearchControls(){for(const prefix of ['job','instant']){const control=$('#'+prefix+'-search-control');if(control&&!control.dataset.searchPanelReady)bindSearchControl(prefix)}}
new MutationObserver(hydrateSearchControls).observe(document.body,{childList:true,subtree:true});
hydrateSearchControls();
function tidyResearchSection(){const form=$('#research-form'),header=form?.querySelector('.research-section-header > div'),toggle=$('#research-use-parent-model');if(!header||!toggle||toggle.parentElement===header)return;const hint=toggle.parentElement?.nextElementSibling;header.append(toggle);if(hint?.matches('p'))header.append(hint)}
new MutationObserver(tidyResearchSection).observe(document.body,{childList:true,subtree:true});
tidyResearchSection();
</script><style>

</style><script>
function sectionizeJobEditor(){const editor=$('#editor'),research=$('#research-form'),result=$('#job-test-result');if(!editor||!research||!result||editor.dataset.jobSectionsReady)return;const titleRow=$('#notice')?.closest('.row'),fields=titleRow?.nextElementSibling,testTitle=result.previousElementSibling;if(!titleRow||!fields||!testTitle)return;const settings=document.createElement('section'),results=document.createElement('section');settings.className='job-section-card job-settings-card';results.className='job-section-card job-results-card';editor.insertBefore(settings,titleRow);settings.append(titleRow,fields);research.classList.add('job-section-card','job-research-card');testTitle.before(results);results.append(testTitle,result);editor.dataset.jobSectionsReady='true'}
new MutationObserver(sectionizeJobEditor).observe(document.body,{childList:true,subtree:true});

</script><style>

</style><script>
let jobResearchTestInProgress=false;
window.testJobPrompt=async function(){if(jobResearchTestInProgress)return;const result=$('#job-test-result'),button=document.querySelector('button[onclick="testJobPrompt()"]');jobResearchTestInProgress=true;if(button){button.disabled=true;button.textContent='저장 및 테스트 실행 중…'}result.textContent='현재 설정을 저장한 뒤 리서치·최종 요약·실제 채널 전송을 실행 중입니다…';try{const saved=await saveJob();if(!saved){result.textContent='저장에 실패해 테스트를 중단했습니다.';return}const data=await api(`/api/jobs/${current}/run?dry_run=false&allow_disabled=true`,{method:'POST'});result.textContent=`테스트 전송 완료: ${data.status}${data.message?' · '+data.message:''}\n\n하위 리서치와 최종 종합 결과가 선택한 채널로 전송되었습니다.`}catch(error){result.textContent='테스트 실패: '+error.message}finally{jobResearchTestInProgress=false;if(button){button.disabled=false;button.textContent='테스트 전송'}}};
</script><script>
const collectResearchTasksWithActivation=collectResearchTasks;
collectResearchTasks=function(){return collectResearchTasksWithActivation().map((task,index)=>({...task,enabled:document.querySelectorAll('#research-task-list .research-enabled')[index]?.checked??researchTasksUi[index]?.enabled!==false}))};
function decorateResearchActivation(){const cards=[...document.querySelectorAll('#research-task-list .settings-group')];cards.forEach((card,index)=>{const enabled=researchTasksUi[index]?.enabled!==false;card.classList.toggle('research-inactive',!enabled);if(card.dataset.activationReady)return;card.dataset.activationReady='true';const header=card.querySelector(':scope > .row'),label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');input.type='checkbox';input.className='research-enabled';input.checked=enabled;input.style.width='auto';text.textContent=' 활성';label.style.cssText='display:flex;align-items:center;gap:3px;margin:0;font-size:13px';label.append(input,text);input.onchange=()=>card.classList.toggle('research-inactive',!input.checked);header?.insertBefore(label,header.querySelector('.research-toggle'))})}

</script><style>
