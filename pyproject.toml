[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-dispatcher"
version = "0.1.0"
description = "Scheduled Open WebUI prompt dispatcher"
requires-python = ">=3.12"
dependencies = ["APScheduler>=3.10,<4", "fastapi>=0.115", "httpx>=0.27", "jinja2>=3.1", "pydantic>=2.7", "PyYAML>=6", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.2", "ruff>=0.5"]

[project.scripts]
prompt-dispatcher = "prompt_dispatcher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_dispatcher = ["adapters/inbound/http/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"] # Boundary adapters must capture unknown third-party failures safely.

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
