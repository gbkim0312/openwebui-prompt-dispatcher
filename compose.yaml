services:
  prompt-dispatcher:
    image: ${IMAGE:-prompt-dispatcher:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt-dispatcher
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: [.env]
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./jobs:/app/jobs
      - ./prompts:/app/prompts
      - ./data:/app/data
    ports: ["8787:8787"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
